<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DupeTec | Contacto</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<!-- Barra de navegación -->
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">DupeTec</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
            aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="servicios.html">Servicios</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="contacto.html">Contacto</a>
                </li>

            </ul>
        </div>
    </div>
</nav>   

<!-- Encabezado de Contacto -->
<section class="bg-light py-5">
    <div class="container text-center">
        <h1 class="fw-bold">Contáctanos</h1>
        <p class="lead">
            Estamos disponibles para ayudarte con tus necesidades tecnológicas.
        </p>
    </div>
</section>

<!-- Formulario de contacto -->
<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <h2 class="mb-4">Envíanos un mensaje</h2>

            <form>

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre"
                        placeholder="Escribe tu nombre">
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo"
                        placeholder="nombre@ejemplo.com">
                </div>

                <div class="mb-3">
                    <label for="servicio" class="form-label">Servicio de interés</label>
                    <select class="form-select" id="servicio">
                        <option selected>Selecciona un servicio</option>
                        <option>Desarrollo Web</option>
                        <option>Soporte Técnico</option>
                        <option>Mantenimiento</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea class="form-control" id="mensaje" rows="4"
                        placeholder="Escribe tu mensaje"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Enviar mensaje
                </button>

            </form>

        </div>
    </div>
</main>

<!-- Pie de página -->
<footer class="bg-dark text-white text-center py-3">
    <div class="container">
        <p class="mb-0">&copy; 2026 DupeTec | Soluciones Tecnológicas</p>
    </div>
</footer>

<!-- JavaScript de Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
